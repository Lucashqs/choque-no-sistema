name: Compilar APK Android

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Permite rodar manualmente clicando em um botão no GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências do sistema Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev build-essential libltdl-dev

      - name: Instalar Buildozer e Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Compilar o aplicativo Android (.apk)
        run: |
          buildozer android debug

      - name: Disponibilizar o arquivo APK para download
        uses: actions/upload-artifact@v4
        with:
          name: ChoqueNoSistema-APK
          path: bin/*.apk
